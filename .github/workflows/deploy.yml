name: deploy

# Deploys famchat.dev (API + web app, one Worker) when main changes: server tests, then
# scripts/deploy.sh (flutter build web, D1 migrations, wrangler deploy, smoke test).
#
# Secrets: CLOUDFLARE_API_TOKEN (an API token with Account: Workers Scripts Edit, D1 Edit,
# Account Settings Read; Zone famchat.dev: Workers Routes Edit, DNS Edit for the custom domain)
# and CLOUDFLARE_ACCOUNT_ID. Without the token the job skips with a warning; deploy locally with
# scripts/deploy.sh instead.

on:
  push:
    branches: [main]
    paths: ["server/**", "app/**", "scripts/deploy.sh", "scripts/smoke-web.sh", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# Shorebird supports this Flutter; move it only to versions Shorebird lists (shorebird flutter versions list).
env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set: nothing was deployed. Run scripts/deploy.sh locally, or add the secret."
          fi

      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: subosito/flutter-action@v2
        if: steps.token.outputs.ok == 'true'
        with: { flutter-version: ${{ env.FLUTTER_VERSION }}, channel: stable, cache: true }

      - name: Server tests
        if: steps.token.outputs.ok == 'true'
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/deploy.sh
