name: patch

# Shorebird patches: Dart-only changes reach installed iPhone and Android apps without a store
# build or review. Phones download a patch in the background and apply it on the next launch.
# Patches can't change native code, plugins, permissions or the Flutter version: Shorebird stops
# on a native change (no --allow-native-diffs here), and those need a release tag instead.
#
# Run by hand (gh workflow run patch.yml [-f platforms=ios] [-f release_version=1.0.17+29380123])
# or push a `patch-*` tag. Each platform patches its newest Shorebird release unless a release
# version is given. FAMCHAT_VERSION/FAMCHAT_BUILD are set from that release, so the app's About
# screen keeps showing the version the store installed.
#
# Secret: SHOREBIRD_TOKEN (Shorebird console API key, "Release and patch only").

on:
  push:
    tags: ["patch-*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated subset of ios,android"
        default: "ios,android"
      release_version:
        description: "Release to patch (e.g. 1.0.17+29380123), or latest for each platform's newest"
        default: "latest"

concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Must match the Flutter the release was built with (release.yml).
env:
  FLUTTER_VERSION: "3.47.9"
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  RELEASE_VERSION: ${{ inputs.release_version || 'latest' }}

jobs:
  ios:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'ios')
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Which release
        id: release
        run: ../scripts/shorebird-release-version.sh ios "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Shorebird patch
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NAME: ${{ steps.release.outputs.name }}
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          shorebird patch ios --no-codesign --release-version="$VERSION" --flutter-version="$FLUTTER_VERSION" -- \
            --dart-define=FAMCHAT_VERSION="$NAME" --dart-define=FAMCHAT_BUILD="$NUMBER"
          echo "Patched iOS release $VERSION" >> "$GITHUB_STEP_SUMMARY"

  android:
    if: github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Which release
        id: release
        run: ../scripts/shorebird-release-version.sh android "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      # A patch carries only the compiled Dart; the bundle's signature isn't part of it, so the
      # build may fall back to the debug key and needs no keystore here.
      - name: Shorebird patch
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NAME: ${{ steps.release.outputs.name }}
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          shorebird patch android --release-version="$VERSION" --flutter-version="$FLUTTER_VERSION" -- \
            --dart-define=FAMCHAT_VERSION="$NAME" --dart-define=FAMCHAT_BUILD="$NUMBER"
          echo "Patched Android release $VERSION" >> "$GITHUB_STEP_SUMMARY"
