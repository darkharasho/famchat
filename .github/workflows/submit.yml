name: submit

# Submit an iOS build that's already in TestFlight for App Store review (scripts/asc-submit.py).
# Store releases are for native changes; Dart-only changes go out as Shorebird patches (patch.yml).
#
# Every hour it reconciles (asc-submit.py reconcile): the newest build in TestFlight goes to review
# unless that version is already live, approved, in review or rejected, or an older version that has
# to be reviewed (native changes; scripts/review-required.sh) is in flight, which is never pulled.
# So releases ship at once (patches, desktop) and the App Store catches up to them eventually.
#
#   gh workflow run submit.yml                                  # status only: versions, reviews, builds
#   gh workflow run submit.yml -f reconcile=true                # what the hourly run does, now
#   gh workflow run submit.yml -f release=latest -f whats_new="…" -f submit=true
#
# release=latest is the newest shorebird/ios/<NAME+NUMBER> tag (builds that reached TestFlight).
# replace_waiting pulls an older version that's waiting for review or in review so this one takes its place.
#
# Secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Reconcile: submit the newest build unless the App Store is already on it (ignores the rest)"
        type: boolean
        default: false
      release:
        description: "Build to submit (NAME+NUMBER, e.g. 1.0.22+29918667) or latest"
        default: "latest"
      whats_new:
        description: "What's New text (needed when the version has none yet)"
        default: ""
      submit:
        description: "Submit for review (off: only show status)"
        type: boolean
        default: false
      replace_waiting:
        description: "Pull an older version that's waiting for review or in review"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_ID: dev.famchat.app
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # scripts/review-required.sh: what can't reach the App Store's live version as a patch
      NATIVE_TAG_PREFIX: shorebird
      NATIVE_CHECK: scripts/shorebird-native-check.sh
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Write the App Store Connect key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          [ -n "$ASC_KEY" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::App Store Connect secrets aren't set."; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8")
      - name: Reconcile
        if: ${{ github.event_name == 'schedule' || inputs.reconcile }}
        run: |
          RELEASE="$(git tag -l 'shorebird/ios/*' | sed 's#^shorebird/ios/##' | sort -t+ -k2,2n | tail -1)"
          [ -n "$RELEASE" ] || { echo "::error::No shorebird/ios/* tag yet."; exit 1; }
          echo "Newest iOS build: $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/asc-submit.py reconcile "$BUNDLE_ID" "$RELEASE" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: Status
        if: ${{ github.event_name != 'schedule' && !inputs.reconcile && !inputs.submit }}
        run: python3 scripts/asc-submit.py status "$BUNDLE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Submit for review
        if: ${{ github.event_name != 'schedule' && !inputs.reconcile && inputs.submit }}
        env:
          RELEASE: ${{ inputs.release }}
          WHATS_NEW: ${{ inputs.whats_new }}
          REPLACE: ${{ inputs.replace_waiting }}
        run: |
          if [ "$RELEASE" = latest ]; then
            RELEASE="$(git tag -l 'shorebird/ios/*' | sed 's#^shorebird/ios/##' | sort -t+ -k2,2n | tail -1)"
            [ -n "$RELEASE" ] || { echo "::error::No shorebird/ios/* tag yet."; exit 1; }
          fi
          args=(submit "$BUNDLE_ID" "$RELEASE")
          [ -n "$WHATS_NEW" ] && args+=(--whats-new "$WHATS_NEW")
          [ "$REPLACE" = true ] && args+=(--replace-waiting)
          python3 scripts/asc-submit.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
