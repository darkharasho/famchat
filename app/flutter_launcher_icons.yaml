# App icons for every platform, from assets/brand (made by tool/brand/make_brand.py).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/famchat-icon.png"
  android: true
  adaptive_icon_background: "assets/brand/famchat-background.png"
  adaptive_icon_foreground: "assets/brand/famchat-foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#2E2550"
  web:
    generate: true
    image_path: "assets/brand/famchat-icon.png"
    background_color: "#2E2550"
    theme_color: "#2E2550"
  # Windows: tool/brand/make_brand.py writes a multi-size .ico instead.
  macos:
    generate: true
    image_path: "assets/brand/famchat-icon-macos.png"
